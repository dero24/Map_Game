name: build + deploy to GitHub Pages

# The repo holds TypeScript source — the browser needs the vite-built dist/. This builds it
# and publishes it to Pages. In repo Settings → Pages → Source: pick "GitHub Actions".

# Every push to main or a feature branch builds and publishes (the last push wins — one Pages
# site), as does a manual run. Branches must also be allowed by the github-pages environment
# (Settings → Environments → github-pages: main and feature/* are).
on:
  push:
    branches: [main, 'feature/*']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
